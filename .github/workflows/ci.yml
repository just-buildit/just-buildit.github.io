name: CI

on:
  push:
    branches: [main]
  # No path filter on pull_request, deliberately. The `main` ruleset requires
  # the "CI passed" check below on every PR, so it has to run on every PR — a
  # path filter would skip the job on an unrelated change and the required
  # check would never arrive, leaving the PR unmergeable forever. That is not
  # hypothetical: it is the state this repo was in until this workflow existed,
  # with a required check no workflow here could ever report.
  pull_request:
  workflow_dispatch: {}

jobs:
  # ------------------------------------------------------------------
  # standard.mk is CANONICAL: every repo in just-buildit and doppler-dsp
  # vendors this exact file, and their `make lint` compares against it on
  # every run with no cache. So a broken publish here does not fail here —
  # it fails in every adopter, at once, the moment they re-vendor. This job
  # is the only place that cost can be caught before it is paid.
  # ------------------------------------------------------------------
  standard-mk:
    name: standard.mk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parses as GNU make, with the config surface unset
        # The file must FAIL cleanly when a required command variable is
        # missing -- that is the gh-issue-class it exists to prevent (a flag
        # turned on with no command behind it is a target that exits 0 having
        # done nothing). A syntax error and a deliberate $(error) look alike to
        # `make`, so assert on the message, not just the exit code.
        run: |
          tmp="$(mktemp -d)"; cp standard.mk "$tmp/"
          printf 'HAS_DOXYGEN = 1\ninclude standard.mk\n' > "$tmp/Makefile"
          out="$(make -C "$tmp" help 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q "TEST_CMD is empty" \
            || { echo "::error::expected a parse-time error naming TEST_CMD"; exit 1; }

      - name: Every feature group defines its targets
        # Turns ON every flag with a command behind each one, so a group whose
        # variables and targets have drifted apart shows up here rather than in
        # whichever adopter enables that flag next.
        run: |
          tmp="$(mktemp -d)"; cp standard.mk "$tmp/"
          cat > "$tmp/Makefile" <<'EOF'
          HAS_C = 1
          HAS_PYTHON = 1
          HAS_RUST = 1
          HAS_DOCS = 1
          HAS_DOXYGEN = 1
          HAS_BENCH = 1
          HAS_COVERAGE = 1
          HAS_RELEASE = 1
          HAS_EXAMPLES = 1
          TEST_CMD = @echo test
          TEST_FAST_CMD = @echo test-fast
          CLEAN_PATHS = dist/
          PYEXT_CMD = @echo pyext
          DOXYGEN_CHECK_CMD = @echo doxygen-check
          BENCH_CMD = @echo bench
          BENCH_SAVE_CMD = @echo bench-save
          BENCH_COMPARE_CMD = @echo bench-compare
          COVERAGE_CMD = @echo coverage
          COVERAGE_GATE_CMD = @echo coverage-gate
          BUMP_VERSION_CMD = @echo bump
          RELEASE_WATCH_CMD = @echo watch
          VERSION_PROBES = pyproject.toml|echo 1.2.3
          TEST_EXAMPLES_CMD = @echo test-examples
          LINT_TOOLS = ruff
          LINT_ruff = @echo lint-ruff
          include standard.mk
          EOF
          make -C "$tmp" help
          n="$(make -C "$tmp" help | grep -cE '^  [a-z]')"
          echo "targets listed: $n"
          [ "$n" -ge 38 ] || { echo "::error::expected >=38 targets, got $n"; exit 1; }

      - name: Its own gates pass, and can fail
        # help-check and ghost-check are what adopters rely on. Prove both
        # directions here: clean tree passes, sabotaged tree fails. A gate that
        # cannot fail is the thing this whole standard exists to stop.
        run: |
          tmp="$(mktemp -d)"; cp standard.mk "$tmp/"
          cat > "$tmp/Makefile" <<'EOF'
          TEST_CMD = @echo test
          TEST_FAST_CMD = @echo test-fast
          CLEAN_PATHS = dist/
          include standard.mk
          EOF
          make -C "$tmp" help-check ghost-check

          printf 'LOCAL_TARGETS = ghosty\n' >> "$tmp/Makefile"
          printf '.PHONY: ghosty\nghosty: ## a target with no recipe\n' >> "$tmp/Makefile"
          if make -C "$tmp" ghost-check > "$tmp/log" 2>&1; then
            cat "$tmp/log"
            echo "::error::ghost-check passed a target with no recipe"; exit 1
          fi
          grep -q "ghosty" "$tmp/log" \
            || { cat "$tmp/log"; echo "::error::ghost-check did not name it"; exit 1; }
          echo "OK — gates pass clean and fail when sabotaged."

      - name: gates-check verifies gates covers CI, and names the gap when not
        # Same both-directions proof for the newest gate. A `make <target>` CI
        # runs that `gates` cannot reach must fail here, naming it — that is the
        # whole point of the target, and a version that could not fail would be
        # exactly the silently-wrong `gates` it replaces.
        run: |
          tmp="$(mktemp -d)"; cp standard.mk "$tmp/"
          mkdir -p "$tmp/.github/workflows"
          cat > "$tmp/Makefile" <<'EOF'
          TEST_CMD = @echo test
          TEST_FAST_CMD = @echo test-fast
          CLEAN_PATHS = dist/
          GATES_DEPS = lint covered
          include standard.mk
          EOF
          # CI runs `make covered` (a gates member) and `make install-deps`
          # (default provisioning) — both accounted for, so gates-check passes.
          printf 'jobs:\n  x:\n    steps:\n      - run: make install-deps\n      - run: make covered\n' \
            > "$tmp/.github/workflows/ci.yml"
          make -C "$tmp" gates-check \
            || { echo "::error::gates-check failed when gates DID cover CI"; exit 1; }
          # Now CI also runs `make orphan`, reachable from nothing — must fail.
          printf '      - run: make orphan\n' >> "$tmp/.github/workflows/ci.yml"
          if make -C "$tmp" gates-check > "$tmp/log" 2>&1; then
            cat "$tmp/log"
            echo "::error::gates-check passed a CI target gates cannot reach"; exit 1
          fi
          grep -q "orphan" "$tmp/log" \
            || { cat "$tmp/log"; echo "::error::gates-check did not name orphan"; exit 1; }
          echo "OK — gates-check passes when complete, fails naming the gap."

      - name: One red gate does not hide the gates behind it
        # `gates` re-invokes its list with -k instead of declaring it as
        # prerequisites, because make stops at the first failing prerequisite
        # and the rest never run. That reads as an ordinary failure while a
        # third of the set was silently skipped -- measured in doppler, where
        # `glibc-check` cannot pass on a dev box by design, sits mid-list, and
        # made six targets behind it structurally unreachable.
        #
        # Four properties, because three of them are what makes the current
        # form SAFE and a fix that drops one is not a fix: everything runs, the
        # run still fails, ALL PASS cannot print, and a clean run still passes.
        #
        # The four recipe lines below carry LITERAL TABS, as every make recipe
        # must. They are legal here because they sit in a block scalar's
        # CONTENT rather than its indentation -- but a reformat that converts
        # them to spaces breaks this fixture, so leave them alone.
        run: |
          tmp="$(mktemp -d)"; cp standard.mk "$tmp/"
          cat > "$tmp/Makefile" <<'EOF'
          TEST_CMD = @echo test
          TEST_FAST_CMD = @echo test-fast
          CLEAN_PATHS = dist/
          GATES_DEPS = first red behind1 behind2
          LOCAL_TARGETS = first red behind1 behind2
          include standard.mk

          first: ## ordered before the red gate
          	@echo RAN-first
          red: ## fails, as some gates do by design
          	@echo RAN-red; exit 1
          behind1: ## ordered behind the red gate
          	@echo RAN-behind1
          behind2: ## also behind
          	@echo RAN-behind2
          EOF
          make -C "$tmp" gates > "$tmp/log" 2>&1 && rc=0 || rc=$?
          cat "$tmp/log"
          for t in first red behind1 behind2; do
            grep -q "RAN-$t" "$tmp/log" \
              || { echo "::error::$t never ran — one red gate still hides the rest"; exit 1; }
          done
          [ "$rc" -ne 0 ] \
            || { echo "::error::a failing gate did not fail the run"; exit 1; }
          grep -q "ALL PASS" "$tmp/log" \
            && { echo "::error::ALL PASS printed with a gate red"; exit 1; }
          # ...and gates-check must survive the list moving out of the
          # prerequisites. It walks the closure from `gates`, so a walk of
          # prerequisites alone now finds NOTHING and reports every CI target
          # as uncovered -- which would turn `make lint` red in every adopter.
          mkdir -p "$tmp/.github/workflows"
          printf 'jobs:\n  x:\n    steps:\n      - run: make install-deps\n      - run: make behind2\n' \
            > "$tmp/.github/workflows/ci.yml"
          make -C "$tmp" gates-check \
            || { echo "::error::gates-check cannot see GATES_DEPS any more"; exit 1; }
          # Clean tree: everything runs, run passes, ALL PASS prints.
          sed -i 's/@echo RAN-red; exit 1/@echo RAN-red/' "$tmp/Makefile"
          make -C "$tmp" gates > "$tmp/ok" 2>&1 \
            || { cat "$tmp/ok"; echo "::error::a clean gates run failed"; exit 1; }
          grep -q "ALL PASS" "$tmp/ok" \
            || { cat "$tmp/ok"; echo "::error::clean run did not print ALL PASS"; exit 1; }
          echo "OK — every gate runs, a red one still fails the run."

      - name: The gates do not re-enter the default goal
        # Both gates dump make's database with `$(MAKE) -rpn`, and -n still
        # EXECUTES recipe lines containing $(MAKE). With no goal named, that
        # sub-make builds .DEFAULT_GOAL -- so a repo configuring ALL_DEPS to
        # reach `lint` (what skills://makefile-convention prescribes for shell
        # repos) made the gates invoke themselves without bound: ~900
        # processes on a bare `make`, and no output saying why. See #13.
        #
        # Bounded by `timeout` rather than asserted structurally, because the
        # regression's symptom is "never returns" -- the only honest test is
        # to run it and require it to finish.
        run: |
          tmp="$(mktemp -d)"; cp standard.mk "$tmp/"
          cat > "$tmp/Makefile" <<'EOF'
          TEST_CMD = @echo test
          TEST_FAST_CMD = @echo test-fast
          CLEAN_PATHS = dist/
          ALL_DEPS = lint test
          include standard.mk
          EOF
          # Distinguish the two failure modes. A bare `||` would report every
          # non-zero exit as "did not terminate", pointing a future operator
          # at a hang when the gates had merely failed for a real reason.
          rc=0
          timeout 60 make -C "$tmp" help-check ghost-check || rc=$?
          if [ "$rc" -eq 124 ]; then
            echo "::error::gates did not terminate with lint in the default goal chain — the recursion is back"
            exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "::error::gates failed (exit $rc) — a real failure, not a hang; see the output above"
            exit 1
          fi
          echo "OK — gates terminate regardless of the default goal."

      - name: Serving matches the repo
        # Only meaningful on main (a PR's copy is not published yet), and it is
        # the question the drift gate asks from the other side: does what Pages
        # actually serves equal what is committed here?
        if: github.ref == 'refs/heads/main'
        run: |
          curl -fsSL -o served.mk https://just-buildit.github.io/standard.mk
          diff -u served.mk standard.mk \
            || { echo "::error::Pages is serving a different standard.mk"; exit 1; }
          echo "OK — Pages serves the committed file."

  # ------------------------------------------------------------------
  # Aggregator: the single "CI passed" check the `main` ruleset requires.
  # Adding a job above means adding it to `needs:` here — otherwise the
  # aggregator goes green while the new job is red, and the required check
  # stops meaning anything. Mirrors doppler and just-buildit/.github so the
  # org has one shape.
  # ------------------------------------------------------------------
  ci-passed:
    name: CI passed
    needs:
      - standard-mk
    runs-on: ubuntu-latest
    # `always()` so this still runs when a dependency failed — otherwise it
    # would be skipped, the required check would never report, and a red PR
    # would look identical to an unmergeable one.
    if: always()
    steps:
      - name: Require all jobs to have succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || \
                "${{ contains(needs.*.result, 'cancelled') }}" == "true" || \
                "${{ contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "::error::a required CI job did not succeed — CI not green"
            exit 1
          fi
          echo "All required CI jobs succeeded."
