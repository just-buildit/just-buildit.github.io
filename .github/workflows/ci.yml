name: CI

on:
  push:
    branches: [main]
  # No path filter on pull_request, deliberately. The `main` ruleset requires
  # the "CI passed" check below on every PR, so it has to run on every PR — a
  # path filter would skip the job on an unrelated change and the required
  # check would never arrive, leaving the PR unmergeable forever. That is not
  # hypothetical: it is the state this repo was in until this workflow existed,
  # with a required check no workflow here could ever report.
  pull_request:
  workflow_dispatch: {}

jobs:
  # ------------------------------------------------------------------
  # standard.mk is CANONICAL: every repo in just-buildit and doppler-dsp
  # vendors this exact file, and their `make lint` compares against it on
  # every run with no cache. So a broken publish here does not fail here —
  # it fails in every adopter, at once, the moment they re-vendor. This job
  # is the only place that cost can be caught before it is paid.
  # ------------------------------------------------------------------
  standard-mk:
    name: standard.mk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Parses as GNU make, with the config surface unset
        # The file must FAIL cleanly when a required command variable is
        # missing -- that is the gh-issue-class it exists to prevent (a flag
        # turned on with no command behind it is a target that exits 0 having
        # done nothing). A syntax error and a deliberate $(error) look alike to
        # `make`, so assert on the message, not just the exit code.
        run: |
          tmp="$(mktemp -d)"; cp standard.mk "$tmp/"
          printf 'HAS_DOXYGEN = 1\ninclude standard.mk\n' > "$tmp/Makefile"
          out="$(make -C "$tmp" help 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q "TEST_CMD is empty" \
            || { echo "::error::expected a parse-time error naming TEST_CMD"; exit 1; }

      - name: Every feature group defines its targets, and passes the gates
        # Turns ON every flag with a command behind each one, so a group whose
        # variables and targets have drifted apart shows up here rather than in
        # whichever adopter enables that flag next.
        run: |
          tmp="$(mktemp -d)"; cp standard.mk "$tmp/"
          cat > "$tmp/Makefile" <<'EOF'
          HAS_C = 1
          HAS_PYTHON = 1
          HAS_RUST = 1
          HAS_DOCS = 1
          HAS_DOXYGEN = 1
          HAS_BENCH = 1
          HAS_COVERAGE = 1
          HAS_RELEASE = 1
          HAS_CHANGELOG = 1
          HAS_EXAMPLES = 1
          HAS_PR_WATCH = 1
          TEST_CMD = @echo test
          TEST_FAST_CMD = @echo test-fast
          CLEAN_PATHS = dist/
          PYEXT_CMD = @echo pyext
          DOXYGEN_CHECK_CMD = @echo doxygen-check
          BENCH_CMD = @echo bench
          BENCH_SAVE_CMD = @echo bench-save
          BENCH_COMPARE_CMD = @echo bench-compare
          COVERAGE_CMD = @echo coverage
          COVERAGE_GATE_CMD = @echo coverage-gate
          BUMP_VERSION_CMD = @echo bump
          RELEASE_WATCH_CMD = @echo watch
          VERSION_PROBES = pyproject.toml|echo 1.2.3
          TEST_EXAMPLES_CMD = @echo test-examples
          CHANGELOG_CODE_PATHS = src
          LINT_TOOLS = ruff
          LINT_ruff = @echo lint-ruff
          include standard.mk
          EOF
          make -C "$tmp" help
          n="$(make -C "$tmp" help | grep -cE '^  [a-z]')"
          echo "targets listed: $n"
          [ "$n" -ge 38 ] || { echo "::error::expected >=38 targets, got $n"; exit 1; }
          # ...and the gates adopters run hold with every group ON. The step
          # below runs them with every group OFF, so a target a feature group
          # adds was never shown to either: `ci-changes` shipped in HAS_RELEASE
          # with no _STD_SECTION arm, and help-check failed `make lint` in the
          # first adopter to re-vendor (just-makeit#1388).
          make -C "$tmp" help-check ghost-check

      - name: Its own gates pass, and can fail
        # help-check and ghost-check are what adopters rely on. Prove both
        # directions here: clean tree passes, sabotaged tree fails. A gate that
        # cannot fail is the thing this whole standard exists to stop.
        run: |
          tmp="$(mktemp -d)"; cp standard.mk "$tmp/"
          cat > "$tmp/Makefile" <<'EOF'
          TEST_CMD = @echo test
          TEST_FAST_CMD = @echo test-fast
          CLEAN_PATHS = dist/
          include standard.mk
          EOF
          make -C "$tmp" help-check ghost-check

          printf 'LOCAL_TARGETS = ghosty\n' >> "$tmp/Makefile"
          printf '.PHONY: ghosty\nghosty: ## a target with no recipe\n' >> "$tmp/Makefile"
          if make -C "$tmp" ghost-check > "$tmp/log" 2>&1; then
            cat "$tmp/log"
            echo "::error::ghost-check passed a target with no recipe"; exit 1
          fi
          grep -q "ghosty" "$tmp/log" \
            || { cat "$tmp/log"; echo "::error::ghost-check did not name it"; exit 1; }
          echo "OK — gates pass clean and fail when sabotaged."

      - name: workflow-timeout-check refuses a job with no ceiling
        # just-makeit#1801 modification 6: a job with no timeout-minutes is
        # not cancelled for GitHub's six-hour default, and an aggregator
        # waits that long to go red (jm#1792, nco_tone). Both indent styles,
        # the two things that must NOT count as a ceiling or a job, the
        # sabotage, and the walk that parses nothing.
        run: |
          tmp="$(mktemp -d)"; cp standard.mk "$tmp/"
          printf 'TEST_CMD = @echo t\nTEST_FAST_CMD = @echo t\nCLEAN_PATHS = d/\ninclude standard.mk\n' > "$tmp/Makefile"
          mkdir -p "$tmp/.github/workflows"; w="$tmp/.github/workflows"

          # No workflows at all is inert.
          make -C "$tmp" workflow-timeout-check

          # 4-space file: a ceiling on each job, a reusable call exempt.
          cat > "$w/a.yml" <<'EOF'
          on: push
          jobs:
              build:
                  runs-on: ubuntu-latest
                  timeout-minutes: 10
                  steps:
                      - run: true
              call:
                  uses: ./.github/workflows/b.yml
          EOF
          make -C "$tmp" workflow-timeout-check | tee "$tmp/log"
          grep -q "2 job(s)" "$tmp/log" || { echo "::error::wrong job count"; exit 1; }

          # SABOTAGE: a 2-space job whose only timeout is on a STEP.
          cat > "$w/b.yml" <<'EOF'
          on: workflow_call
          jobs:
            lone:
              runs-on: ubuntu-latest
              steps:
                - run: true
                  timeout-minutes: 5
          EOF
          if make -C "$tmp" workflow-timeout-check > "$tmp/log" 2>&1; then
            cat "$tmp/log"; echo "::error::a step timeout passed as a job ceiling"; exit 1
          fi
          grep -q "b.yml: lone" "$tmp/log" \
            || { cat "$tmp/log"; echo "::error::it did not name file and job"; exit 1; }

          # SABOTAGE: workflows exist but nothing parses as a job.
          rm "$w"/*.yml; printf 'on: push\njobs: {}\n' > "$w/c.yml"
          if make -C "$tmp" workflow-timeout-check > "$tmp/log" 2>&1; then
            cat "$tmp/log"; echo "::error::an empty walk passed"; exit 1
          fi
          echo "OK — workflow-timeout-check counts jobs, refuses step-only and empty walks."
          # And this repo is held to it too: the rule is org-wide.
          make -f standard.mk workflow-timeout-check \
              TEST_CMD=x TEST_FAST_CMD=x CLEAN_PATHS=x

      - name: workflow-dispatch-check refuses a self-triggered workflow with no way back in
        # Moved here from just-makeit#1799 (just-makeit#1801): a run that
        # fails at startup cannot be re-run, so a workflow that runs on its
        # own must also be dispatchable. Every `on:` spelling, the reusable
        # exemption, the sabotage, and the walk that parses nothing.
        run: |
          tmp="$(mktemp -d)"; cp standard.mk "$tmp/"
          printf 'TEST_CMD = @echo t\nTEST_FAST_CMD = @echo t\nCLEAN_PATHS = d/\ninclude standard.mk\n' > "$tmp/Makefile"
          mkdir -p "$tmp/.github/workflows"; w="$tmp/.github/workflows"
          make -C "$tmp" workflow-dispatch-check            # no workflows: inert

          printf 'on: [push, workflow_dispatch]\njobs: {}\n' > "$w/flow.yml"
          printf 'on:\n  pull_request:\n  workflow_dispatch:\n    inputs: {}\njobs: {}\n' > "$w/map.yml"
          printf 'on:\n  - schedule\n  - workflow_dispatch\njobs: {}\n' > "$w/list.yml"
          printf 'on: workflow_call\njobs: {}\n' > "$w/reusable.yml"
          make -C "$tmp" workflow-dispatch-check | tee "$tmp/log"
          grep -q "4 workflow(s)" "$tmp/log" || { echo "::error::wrong count"; exit 1; }

          # SABOTAGE: a workflow on push alone.
          printf 'on:\n  push:\n    branches: [main]\njobs: {}\n' > "$w/stuck.yml"
          if make -C "$tmp" workflow-dispatch-check > "$tmp/log" 2>&1; then
            cat "$tmp/log"; echo "::error::a push-only workflow passed"; exit 1
          fi
          grep -q "stuck.yml" "$tmp/log" || { cat "$tmp/log"; echo "::error::not named"; exit 1; }

          # SABOTAGE: workflows that parse no trigger at all.
          rm "$w"/*.yml; printf 'name: x\njobs: {}\n' > "$w/none.yml"
          if make -C "$tmp" workflow-dispatch-check > "$tmp/log" 2>&1; then
            cat "$tmp/log"; echo "::error::an empty walk passed"; exit 1
          fi

          # And this repo is held to it too.
          make -f standard.mk workflow-dispatch-check TEST_CMD=x TEST_FAST_CMD=x CLEAN_PATHS=x
          echo "OK — workflow-dispatch-check: three spellings, reusable exempt, push-only and empty refused."

      - name: close-keywords-check refuses a closing keyword the PR does not declare
        # #124: just-makeit#1962's squash said an issue was filed and not
        # fixed, with the reference straight after the colon, and GitHub
        # closed just-makeit#1960. Fixture branches through `make`, each with
        # the event file Actions hands the step: the refusal names the commit,
        # line and phrase; a branch whose only closing reference is its own
        # (gh-N) passes; every keyword in every spelling, each reference form
        # and a line break between them are refused; `lint` runs the gate; a
        # push is inert. The grammar in full, a shallow checkout and a stale
        # base are tests/test_close_keywords.py, run by the changelog job.
        run: |
          tmp="$(mktemp -d)"; cp standard.mk "$tmp/"
          mkdir "$tmp/scripts"; cp scripts/close-keywords.py "$tmp/scripts/"
          printf 'TEST_CMD = @echo t\nTEST_FAST_CMD = @echo t\nCLEAN_PATHS = d/\ninclude standard.mk\n' > "$tmp/Makefile"
          g() { git -C "$tmp" -c user.name=t -c user.email=t@t "$@"; }
          g init -q -b main; g add -A; g commit -qm base
          base=$(g rev-parse HEAD)
          # pr <title> <message>: a one-commit branch off base, the event
          # Actions would write for it, and the gate's output in $tmp/log.
          pr() {
            g checkout -q --detach "$base"
            g commit -q --allow-empty -m "$2"
            TITLE="$1" HEAD_SHA=$(g rev-parse HEAD) BASE_SHA="$base" python3 -c '
          import json, os
          e = os.environ
          print(json.dumps({"repository": {"full_name": "acme/widget"},
              "pull_request": {"title": e["TITLE"], "body": "", "commits": 1,
                  "head": {"sha": e["HEAD_SHA"]}, "base": {"sha": e["BASE_SHA"]}}}))
          ' > "$tmp/event.json"
            GITHUB_EVENT_NAME=pull_request GITHUB_EVENT_PATH="$tmp/event.json" \
              make -s -C "$tmp" close-keywords-check > "$tmp/log" 2>&1
          }
          refuse() {  # refuse <message> <phrase>: refused, naming both
            if pr "fix: a (gh-7)" "$1"; then
              cat "$tmp/log"; echo "::error::'$2' passed"; exit 1
            fi
            grep -qF "commit $(g rev-parse --short=8 HEAD), line 3: \"$2\"" "$tmp/log" \
              || { cat "$tmp/log"; echo "::error::no commit, line and '$2' named"; exit 1; }
          }

          # The incident's shape, and the branch that only closes its own.
          refuse $'fix: a (gh-7)\n\nFound and filed, not fixed: gh-123.' "fixed: gh-123"
          grep -q '"filed gh-N"' "$tmp/log" || { cat "$tmp/log"; echo "::error::no rewording offered"; exit 1; }
          pr "fix: a (gh-7)" $'fix: a (gh-7)\n\nThis fixes gh-7 at last.' \
            || { cat "$tmp/log"; echo "::error::its own (gh-N) was refused"; exit 1; }
          grep -q "each one declared" "$tmp/log" || { cat "$tmp/log"; exit 1; }

          # Every keyword GitHub documents, in each case, with and without
          # the colon; every reference form; and across a line break.
          n=0
          for kw in close closes closed fix fixes fixed resolve resolves resolved; do
            for spelt in "$kw" "${kw^}" "${kw^^}"; do
              for sep in " " ": "; do
                refuse "x"$'\n\n'"Left open: $spelt${sep}gh-123 later." "$spelt${sep}gh-123"
                n=$((n + 1))
              done
            done
          done
          [ "$n" -eq 54 ] || { echo "::error::$n keyword forms, expected 54"; exit 1; }
          for ref in '#123' GH-123 acme/widget#123 other/repo#123 \
                     https://github.com/acme/widget/issues/123; do
            refuse "x"$'\n\n'"Left open: fixes $ref later." "fixes $ref"
          done
          refuse $'x\n\nFiled, not fixed:\ngh-123 (it reads on).' "fixed: gh-123"

          # `lint` runs it -- the one target every adopter's CI runs -- and
          # every repo vendors the script it runs, flag or no flag.
          make -s -C "$tmp" -pn lint 2>/dev/null | grep -qE '^lint:.* close-keywords-check( |$)' \
            || { echo "::error::lint does not run close-keywords-check"; exit 1; }
          make -s -C "$tmp" standard-files | grep -qx scripts/close-keywords.py \
            || { echo "::error::scripts/close-keywords.py is not vendored"; exit 1; }
          # Any other event is inert: on a push the issue is already closed.
          GITHUB_EVENT_NAME=push make -s -C "$tmp" close-keywords-check | grep -q "inert" \
            || { echo "::error::a push run was not inert"; exit 1; }

          # And this repo's own pull requests are held to it, from the
          # default shallow checkout, which the script must deepen.
          make -f standard.mk close-keywords-check TEST_CMD=x TEST_FAST_CMD=x CLEAN_PATHS=x
          echo "OK — close-keywords-check: refuses $n keyword forms and every reference form, passes a declared one."

      - name: ci-changes-wiring-check refuses a ci.yml job that ignores changes
        # Each tree that lands on main is tested once (just-makeit#1801) only
        # if ci.yml asks the vendored changes job and every job listens.
        # just-bashit and just-buildit vendored ci-tree-tested and never
        # asked, so every merge re-ran the matrix (2026-10-03). The passing
        # shapes, every `needs:` spelling, each sabotage, the empty walk.
        run: |
          tmp="$(mktemp -d)"; cp standard.mk "$tmp/"
          printf '%s\n' 'HAS_RELEASE = 1' 'BUMP_VERSION_CMD = true' \
            'RELEASE_WATCH_CMD = true' 'VERSION_PROBES = v|echo 1' \
            'TEST_CMD = @echo t' 'TEST_FAST_CMD = @echo t' 'CLEAN_PATHS = d/' \
            'include standard.mk' > "$tmp/Makefile"
          mkdir -p "$tmp/.github/workflows"; w="$tmp/.github/workflows/ci.yml"
          gate() { make -s -C "$tmp" ci-changes-wiring-check > "$tmp/log" 2>&1; }
          refuse() {
            if gate; then cat "$tmp/log"; echo "::error::$1 passed"; exit 1; fi
            grep -q -- "$2" "$tmp/log" \
              || { cat "$tmp/log"; echo "::error::$1: no '$2' in the refusal"; exit 1; }
          }

          # No ci.yml is inert.
          gate || { cat "$tmp/log"; exit 1; }

          # Passing: inline, flow and block `needs:`, a folded `if:`, the
          # aggregator, and a job that runs after it.
          cat > "$w" <<'EOF'
          on: [push, pull_request]
          jobs:
            changes:
              uses: ./.github/workflows/changes.yml
            lint:
              needs: changes
              if: needs.changes.outputs.src == 'true'
              runs-on: ubuntu-latest
            test:
              needs: [changes, lint]
              if: >-
                needs.changes.outputs.src == 'true' &&
                needs.changes.outputs.code != 'false'
              runs-on: ubuntu-latest
            docs:
              needs:
                - changes
              if: needs.changes.outputs.docs == 'true'
              runs-on: ubuntu-latest
            wheel:
              needs:
                [changes, lint]
              if: needs.changes.outputs.src == 'true'
              runs-on: ubuntu-latest
            ci-passed:
              name: CI passed
              needs: [changes, lint, test, docs, wheel]
              if: always()
              runs-on: ubuntu-latest
            mirror:
              needs: ci-passed
              if: always() && needs.ci-passed.result == 'success'
              runs-on: ubuntu-latest
          EOF
          gate || { cat "$tmp/log"; echo "::error::a wired ci.yml was refused"; exit 1; }
          grep -q "7 job(s)" "$tmp/log" || { cat "$tmp/log"; echo "::error::wrong job count"; exit 1; }

          # SABOTAGE: a job after the aggregator with no always(): GitHub's
          # implicit success() skips it whenever the matrix was skipped.
          sed -i "s/if: always() \&\& needs.ci-passed.result == 'success'/if: github.event_name == 'push'/" "$w"
          refuse "a post-CI job without always()" "  mirror"
          sed -i "s/if: github.event_name == 'push'/if: always() \&\& needs.ci-passed.result == 'success'/" "$w"
          gate || { cat "$tmp/log"; echo "::error::restoring always() did not pass"; exit 1; }

          # SABOTAGE: a job that needs changes but never reads its outputs.
          sed -i "/^  lint:/,/^  test:/{/if: needs.changes/d}" "$w"
          refuse "a job with no if:" "  lint"

          # SABOTAGE: a job that reads the outputs but never needs the job.
          cat > "$w" <<'EOF'
          jobs:
            changes:
              uses: ./.github/workflows/changes.yml
            stray:
              if: needs.changes.outputs.src == 'true'
              runs-on: ubuntu-latest
            ci-passed:
              name: CI passed
              needs: [changes, stray]
              if: always()
          EOF
          refuse "a job not waiting on changes" "  stray"

          # Always-run by declaration: excused, and named in the summary.
          # A declared name with no such job is refused.
          make -s -C "$tmp" ci-changes-wiring-check CI_ALWAYS_RUN_JOBS=stray > "$tmp/log" 2>&1 \
            || { cat "$tmp/log"; echo "::error::a declared always-run job was refused"; exit 1; }
          grep -q "1 declared always-run" "$tmp/log" || { cat "$tmp/log"; echo "::error::count"; exit 1; }
          if make -s -C "$tmp" ci-changes-wiring-check CI_ALWAYS_RUN_JOBS="stray gone" > "$tmp/log" 2>&1; then
            cat "$tmp/log"; echo "::error::a stale always-run name passed"; exit 1
          fi
          grep -q "  gone" "$tmp/log" || { cat "$tmp/log"; echo "::error::stale name not named"; exit 1; }

          # SABOTAGE: no call, then no aggregator.
          sed -i 's|uses: ./.github/workflows/changes.yml|runs-on: ubuntu-latest|' "$w"
          refuse "a ci.yml with no changes call" "no job calling"
          printf 'jobs:\n  changes:\n    uses: ./.github/workflows/changes.yml\n' > "$w"
          refuse "a ci.yml with no aggregator" "no job named 'CI passed'"

          # SABOTAGE: nothing parses as a job.
          printf 'on: push\njobs: {}\n' > "$w"
          refuse "an empty walk" "no job was parsed"

          # The vendored workflow asks the Makefile for the aggregator's
          # name -- it must hold no literal copy of it.
          [ "$(make -s -C "$tmp" ci-check-name)" = "CI passed" ] \
            || { echo "::error::ci-check-name"; exit 1; }
          grep -q 'make -s ci-check-name' github/workflows/changes.yml \
            || { echo "::error::changes.yml does not read ci-check-name"; exit 1; }
          if grep -nE '^[^#]*CI_CHECK(_NAME)?=.?"?CI passed' github/workflows/changes.yml; then
            echo "::error::changes.yml carries a literal check name"; exit 1
          fi
          echo "OK — ci-changes-wiring-check passes the wired shapes and names each stray."

      - name: standard-update fetches a newly vendored file in ONE run
        # just-buildit.github.io#76: the vendored list is the one the running
        # make parsed from the OLD standard.mk, so a canonical that adds a
        # file needed two runs -- and the adopter bot does one. A file://
        # canonical adds scripts/new.sh; a single run must fetch it and pass.
        run: |
          root="$PWD"
          tmp="$(mktemp -d)"; canon="$tmp/canon"; app="$tmp/app"
          mkdir -p "$canon/scripts" "$app"
          # Canonical v2 = the file under test and the scripts it serves (one,
          # close-keywords.py, every repo vendors), plus a NEW vendored script.
          cp "$root/standard.mk" "$canon/standard.mk"
          cp -R "$root/scripts/." "$canon/scripts/"
          printf '\nVENDORED_FILES += scripts/new.sh\n' >> "$canon/standard.mk"
          printf '#!/bin/sh\necho new\n' > "$canon/scripts/new.sh"
          # The adopter vendors v1 (the file under test, without the new entry).
          cp "$root/standard.mk" "$app/standard.mk"
          printf 'TEST_CMD = @echo t\nTEST_FAST_CMD = @echo t\nCLEAN_PATHS = d/\nSTANDARD_URL = file://%s/standard.mk\ninclude standard.mk\n' "$canon" > "$app/Makefile"
          make -C "$app" --no-print-directory standard-update
          test -f "$app/scripts/new.sh" || { echo "::error::one pass did not fetch the new vendored file"; exit 1; }
          cmp -s "$app/standard.mk" "$canon/standard.mk" || { echo "::error::standard.mk not updated"; exit 1; }
          echo "OK — one standard-update fetched a newly vendored file and checks green."

      - name: hook-stage-check catches a hook that runs nowhere
        # The gate exists because a hook can be configured, dispatch to a real
        # target, pass hook-dispatch-check, and still execute on no machine and
        # in no pipeline -- `stages: [pre-push]` with no
        # `default_install_hook_types`, while `make lint` runs the default
        # stage. Zero findings because it never looked. Measured in doppler,
        # where two gates sat that way for months (doppler#737).
        #
        # Both directions, and the exemptions, because a gate that only ever
        # passes is indistinguishable from one that is not wired.
        run: |
          tmp="$(mktemp -d)"; cp standard.mk "$tmp/"
          cat > "$tmp/Makefile" <<'EOF'
          TEST_CMD = @echo test
          TEST_FAST_CMD = @echo test-fast
          CLEAN_PATHS = dist/
          include standard.mk
          EOF

          # No config at all is inert, not a failure: a repo without
          # pre-commit is not being asked to care.
          make -C "$tmp" hook-stage-check

          # Wired correctly -> passes.
          cat > "$tmp/.pre-commit-config.yaml" <<'EOF'
          default_install_hook_types: [pre-commit, pre-push]
          repos:
            - repo: local
              hooks:
                - id: x
                  name: x
                  entry: make -s lint
                  language: system
                  stages: [pre-push]
          EOF
          make -C "$tmp" hook-stage-check

          # SABOTAGE: drop the declaration. The hook is now installed by
          # nothing, which is the exact doppler#737 shape.
          sed -i '/default_install_hook_types/d' "$tmp/.pre-commit-config.yaml"
          if make -C "$tmp" hook-stage-check > "$tmp/log" 2>&1; then
            cat "$tmp/log"
            echo "::error::hook-stage-check passed a hook that runs nowhere"; exit 1
          fi
          grep -q "pre-push" "$tmp/log" \
            || { cat "$tmp/log"; echo "::error::it did not name the stage"; exit 1; }

          # `manual` is a deliberate opt-out, not an accident -> exempt.
          cat > "$tmp/.pre-commit-config.yaml" <<'EOF'
          repos:
            - repo: local
              hooks:
                - id: x
                  name: x
                  entry: make -s lint
                  language: system
                  stages: [manual]
          EOF
          make -C "$tmp" hook-stage-check
          echo "OK — hook-stage-check passes wired, fails orphaned, exempts manual."

      - name: hook-dispatch-check refuses a hook that does not go through make
        # just-makeit#1801 item 4: counting only the hooks that DO dispatch
        # reported "7 resolve" while uv-lock ran upstream's own uv, pinned
        # apart from the repo's. A remote hook has no entry: at all, so the
        # gate is per hook, by id, with declared exceptions that cannot go
        # stale. Both directions, and the exception list.
        run: |
          tmp="$(mktemp -d)"; cp standard.mk "$tmp/"
          mk() {
            printf 'TEST_CMD = @echo test\nTEST_FAST_CMD = @echo test-fast\n' > "$tmp/Makefile"
            printf 'CLEAN_PATHS = dist/\nHOOK_DISPATCH_EXEMPT = %s\n' "$1" >> "$tmp/Makefile"
            printf 'include standard.mk\n' >> "$tmp/Makefile"
          }
          cat > "$tmp/.pre-commit-config.yaml" <<'EOF'
          repos:
            - repo: local
              hooks:
                - id: plain
                  name: plain
                  entry: make -s lint
                  language: system
                - id: quoted
                  name: quoted
                  entry: "make -s lint"
                  language: system
          EOF

          # Every hook dispatches, quoted or not -> passes, and BOTH are
          # resolved: the quoted entry's target used to go unchecked.
          mk ""; make -C "$tmp" hook-dispatch-check | tee "$tmp/log"
          grep -q "2 make dispatch(es) resolve" "$tmp/log" \
            || { echo "::error::a quoted dispatch was not resolved"; exit 1; }

          # SABOTAGE: a remote hook, no entry: -> refused, by id.
          cat >> "$tmp/.pre-commit-config.yaml" <<'EOF'
            - repo: https://github.com/pre-commit/pre-commit-hooks
              rev: v6.0.0
              hooks:
                - id: trailing-whitespace
          EOF
          if make -C "$tmp" hook-dispatch-check > "$tmp/log" 2>&1; then
            cat "$tmp/log"
            echo "::error::hook-dispatch-check passed a hook that runs its own tool"; exit 1
          fi
          grep -q "trailing-whitespace" "$tmp/log" \
            || { cat "$tmp/log"; echo "::error::it did not name the hook"; exit 1; }

          # Declared as an exception -> passes, and says how many.
          mk "trailing-whitespace"; make -C "$tmp" hook-dispatch-check | tee "$tmp/log"
          grep -q "1 declared exception" "$tmp/log" \
            || { echo "::error::it did not count the exception"; exit 1; }

          # SABOTAGE: an exception that names no non-dispatching hook -> stale.
          mk "trailing-whitespace plain"
          if make -C "$tmp" hook-dispatch-check > "$tmp/log" 2>&1; then
            cat "$tmp/log"
            echo "::error::hook-dispatch-check kept a stale exception"; exit 1
          fi
          grep -q "plain" "$tmp/log" \
            || { cat "$tmp/log"; echo "::error::it did not name the stale one"; exit 1; }
          echo "OK — hook-dispatch-check refuses undeclared, accepts declared, refuses stale."

      - name: standard-check walks the whole vendored list, and cannot pass on nothing
        # The drift gate compares a LIST now, not one file. Three ways it could
        # go quietly wrong, each asserted rather than assumed:
        #   1. a file in VENDORED_FILES is simply absent   -> must FAIL, not skip
        #   2. the list is empty                           -> must FAIL, not pass
        #   3. a listed file differs from canonical        -> must FAIL, naming it
        # (1) and (2) are the "green because it covered zero things" class that
        # has bitten this org before, so they are the ones tested hardest.
        run: |
          tmp="$(mktemp -d)"; cp standard.mk "$tmp/"
          # Canonical for the test is served Pages content, which is stable and
          # real: standard.mk itself plus get-jb.sh, both published at the root.
          # `override` makes the list exactly this one: standard.mk adds a file
          # every repo vendors (scripts/close-keywords.py), which Pages serves
          # only once the change adding it merges -- and the walk is under test
          # here, not what is on it.
          curl -fsSL https://just-buildit.github.io/standard.mk -o "$tmp/canonical.mk"
          curl -fsSL https://just-buildit.github.io/get-jb.sh   -o "$tmp/get-jb.sh"
          cat > "$tmp/Makefile" <<'EOF'
          TEST_CMD = @echo test
          TEST_FAST_CMD = @echo test-fast
          CLEAN_PATHS = dist/
          STANDARD_FILE = canonical.mk
          override VENDORED_FILES = get-jb.sh
          include standard.mk
          EOF

          out="$(make -C "$tmp" standard-check)" || { echo "$out"; \
            echo "::error::clean tree should pass"; exit 1; }
          echo "$out"
          echo "$out" | grep -q "2 vendored file(s) match" \
            || { echo "::error::expected a count of 2, got: $out"; exit 1; }

          # (1) listed but absent
          mv "$tmp/get-jb.sh" "$tmp/elsewhere"
          if make -C "$tmp" standard-check > "$tmp/log" 2>&1; then
            cat "$tmp/log"
            echo "::error::standard-check passed with a vendored file missing"; exit 1
          fi
          grep -q "get-jb.sh is vendored but missing" "$tmp/log" \
            || { cat "$tmp/log"; echo "::error::did not name the missing file"; exit 1; }
          mv "$tmp/elsewhere" "$tmp/get-jb.sh"

          # (2) nothing to compare at all
          sed -i 's/^STANDARD_FILE = .*/STANDARD_FILE =/; s/^override VENDORED_FILES = .*/override VENDORED_FILES =/' \
            "$tmp/Makefile"
          if make -C "$tmp" standard-check > "$tmp/log" 2>&1; then
            cat "$tmp/log"
            echo "::error::standard-check passed having compared 0 files"; exit 1
          fi
          grep -q "compared 0 files" "$tmp/log" \
            || { cat "$tmp/log"; echo "::error::expected the compared-0-files guard"; exit 1; }

          # (3) present but drifted
          sed -i 's/^STANDARD_FILE =$/STANDARD_FILE = canonical.mk/; s/^override VENDORED_FILES =$/override VENDORED_FILES = get-jb.sh/' \
            "$tmp/Makefile"
          echo "# drift" >> "$tmp/get-jb.sh"
          if make -C "$tmp" standard-check > "$tmp/log" 2>&1; then
            cat "$tmp/log"
            echo "::error::standard-check passed a drifted file"; exit 1
          fi
          grep -q "get-jb.sh differs from" "$tmp/log" \
            || { cat "$tmp/log"; echo "::error::did not name the drifted file"; exit 1; }
          echo "OK — walks the list, names what broke, cannot pass on nothing."

      - name: A vendored .github/ path is fetched from github/
        # Pages never serves `.github/`, so `.github/dependabot.yml` is
        # published as `github/dependabot.yml`; _std_vendor_src maps one to
        # the other for BOTH standard-update and standard-check. Hermetic: a
        # file:// canonical that has only `github/`, so the fetch can only
        # succeed through the mapping, and without it the update fails. The
        # list is `override`, so it is exactly this one file: a script every
        # repo vendors would otherwise join it, and this canonical has none.
        run: |
          tmp="$(mktemp -d)"; canon="$tmp/canon"
          mkdir -p "$canon/github" "$tmp/a"
          cp standard.mk "$canon/standard.mk"; cp standard.mk "$tmp/a/"
          printf 'version: 2\n' > "$canon/github/dependabot.yml"
          cat > "$tmp/a/Makefile" <<EOF
          TEST_CMD = @echo test
          TEST_FAST_CMD = @echo test-fast
          CLEAN_PATHS = dist/
          STANDARD_URL = file://$canon/standard.mk
          override VENDORED_FILES = .github/dependabot.yml
          include standard.mk
          EOF
          make -C "$tmp/a" standard-update
          cmp "$canon/github/dependabot.yml" "$tmp/a/.github/dependabot.yml"
          make -C "$tmp/a" standard-check | grep -q "2 vendored file(s) match" \
            || { echo "::error::a clean .github/ vendored file did not pass"; exit 1; }
          echo "# drift" >> "$tmp/a/.github/dependabot.yml"
          if make -C "$tmp/a" standard-check > "$tmp/log" 2>&1; then
            cat "$tmp/log"; echo "::error::a drifted .github/ file passed"; exit 1
          fi
          grep -q "differs from file://$canon/github/dependabot.yml" "$tmp/log" \
            || { cat "$tmp/log"; echo "::error::did not name the github/ source"; exit 1; }
          echo "OK: .github/ is fetched from github/, and its drift is named."

      - name: Canonical's own Dependabot config is the one it publishes
        # Dependabot reads only `.github/dependabot.yml`, which Pages cannot
        # serve; adopters get `github/dependabot.yml`. Two copies in one repo
        # are the drift this file exists to stop, so they are compared.
        run: cmp .github/dependabot.yml github/dependabot.yml

      - name: gates-check verifies gates covers CI, and names the gap when not
        # Same both-directions proof for the newest gate. A `make <target>` CI
        # runs that `gates` cannot reach must fail here, naming it — that is the
        # whole point of the target, and a version that could not fail would be
        # exactly the silently-wrong `gates` it replaces.
        run: |
          tmp="$(mktemp -d)"; cp standard.mk "$tmp/"
          mkdir -p "$tmp/.github/workflows"
          cat > "$tmp/Makefile" <<'EOF'
          TEST_CMD = @echo test
          TEST_FAST_CMD = @echo test-fast
          CLEAN_PATHS = dist/
          GATES_DEPS = lint covered
          include standard.mk
          EOF
          # CI runs `make covered` (a gates member) and `make install-deps`
          # (default provisioning) — both accounted for, so gates-check passes.
          printf 'jobs:\n  x:\n    steps:\n      - run: make install-deps\n      - run: make covered\n' \
            > "$tmp/.github/workflows/ci.yml"
          make -C "$tmp" gates-check \
            || { echo "::error::gates-check failed when gates DID cover CI"; exit 1; }
          # Now CI also runs `make orphan`, reachable from nothing — must fail.
          printf '      - run: make orphan\n' >> "$tmp/.github/workflows/ci.yml"
          if make -C "$tmp" gates-check > "$tmp/log" 2>&1; then
            cat "$tmp/log"
            echo "::error::gates-check passed a CI target gates cannot reach"; exit 1
          fi
          grep -q "orphan" "$tmp/log" \
            || { cat "$tmp/log"; echo "::error::gates-check did not name orphan"; exit 1; }
          echo "OK — gates-check passes when complete, fails naming the gap."

      - name: gates-home-check holds GATES_CI_EXTRA to a real workflow line
        # GATES_CI_EXTRA names targets run by a workflow other than
        # GATES_CI_FILE, and used to be taken on trust: naming a target there
        # gave it an execution home by declaration, so a deleted, renamed or
        # commented-out workflow line left the gate "covered" and guarding
        # nothing (just-makeit#1768, found in doppler). Each row below is one
        # way that home goes missing; every one must go red, naming the
        # target, while the unchanged tree stays green.
        run: |
          tmp="$(mktemp -d)"; cp standard.mk "$tmp/"
          mkdir -p "$tmp/.github/workflows"
          cat > "$tmp/Makefile" <<'EOF'
          TEST_CMD = @echo test
          TEST_FAST_CMD = @echo test-fast
          CLEAN_PATHS = dist/
          GATES_DEPS = lint nightly-check
          GATES_CI_EXTRA = nightly-check
          include standard.mk
          EOF
          printf 'jobs:\n  x:\n    steps:\n      - run: make lint\n' \
            > "$tmp/.github/workflows/ci.yml"
          # The `name:` mentions the target too: it must not count as a home.
          cat > "$tmp/nightly.yml" <<'EOF'
          on: {schedule: [{cron: '0 6 * * *'}]}
          jobs:
            y:
              steps:
                - name: make nightly-check
                  run: make nightly-check
          EOF
          home() { cp "$tmp/nightly.yml" "$tmp/.github/workflows/nightly.yml"; }
          red() {  # red <row> <name> [make args...]: must fail, naming <name>
            row="$1"; name="$2"; shift 2
            if make -C "$tmp" gates-home-check "$@" > "$tmp/log" 2>&1; then
              cat "$tmp/log"
              echo "::error::gates-home-check passed: $row"; exit 1
            fi
            grep -q "'make $name'" "$tmp/log" \
              || { cat "$tmp/log"; echo "::error::$row: did not name $name"; exit 1; }
            echo "ok   red: $row"
          }
          home
          make -C "$tmp" gates-home-check \
            || { echo "::error::gates-home-check failed on a real home"; exit 1; }
          echo "ok   green: workflows unchanged"
          sed -i '/run: make nightly-check/d' "$tmp/.github/workflows/nightly.yml"
          red "the workflow's make line deleted" nightly-check
          home
          sed -i 's/run: make nightly-check/# run: make nightly-check/' \
            "$tmp/.github/workflows/nightly.yml"
          red "the workflow's make line commented out" nightly-check
          home
          rm "$tmp/.github/workflows/nightly.yml"
          red "the workflow deleted" nightly-check
          home
          red "GATES_CI_EXTRA emptied" nightly-check GATES_CI_EXTRA=
          red "a ghost extra no workflow runs" ghost-gate \
            "GATES_DEPS=lint ghost-gate" GATES_CI_EXTRA=ghost-gate
          red "GATES_WORKFLOW_DIR pointed at a dir with no home" nightly-check \
            GATES_WORKFLOW_DIR="$tmp/nowhere"
          # A matrix arm is a home, read by the same scan as GATES_CI_FILE --
          # and a commented one is not. The run line is written by printf
          # with `\x24` for the dollar: Actions expands every literal
          # dollar-brace-brace in this script before bash sees it, which
          # turned the arm into a bare `make` (and this step red) on the
          # first CI run.
          cat > "$tmp/.github/workflows/nightly.yml" <<'EOF'
          jobs:
            y:
              strategy:
                matrix:
                  chk:
                    - { target: nightly-check }
              steps:
          EOF
          printf '      - run: make \x24{{ matrix.chk.target }}\n' \
            >> "$tmp/.github/workflows/nightly.yml"
          grep -q 'make [$]{{ matrix.chk.target }}' "$tmp/.github/workflows/nightly.yml" \
            || { cat "$tmp/.github/workflows/nightly.yml"; echo "::error::fixture lost its matrix arm"; exit 1; }
          make -C "$tmp" gates-home-check \
            || { echo "::error::gates-home-check missed a matrix-arm home"; exit 1; }
          echo "ok   green: a matrix arm in another workflow"
          sed -i 's/- run: make/# - run: make/' "$tmp/.github/workflows/nightly.yml"
          red "the matrix arm's make line commented out" nightly-check
          echo "OK — a GATES_CI_EXTRA name counts only with a real workflow line."

      - name: A target name is looked up as a string, never as a pattern
        # gates-check, gates-home-check, help and hook-dispatch-check each
        # find a target's rule by its name. Pasted into a sed pattern, a name
        # holding `/` ended the expression ("unknown option to `s'"), so that
        # prerequisite was never walked; and `.` matched any character, so
        # v1.2-check also read v1x2-check's rule and gates-check passed a CI
        # target `gates` never ran (#122). Every lookup is exercised through
        # both kinds of name. A pass must leave stderr EMPTY: a gate that
        # prints an error above its OK line teaches readers to ignore stderr.
        run: |
          tmp="$(mktemp -d)"; cp standard.mk "$tmp/"
          mkdir -p "$tmp/.github/workflows"
          ci="$tmp/.github/workflows/ci.yml"
          # v1x2-check comes FIRST: it is what `v1.2-check` matches as a
          # pattern, and a first match is what a lookup by pattern returns.
          cat > "$tmp/Makefile" <<'EOF'
          TEST_CMD = @echo test
          TEST_FAST_CMD = @echo test-fast
          CLEAN_PATHS = dist/
          GATES_DEPS = lint covered deep dotdeep ci/all agg.x
          LOCAL_TARGETS = v1x2-check v1.2-check covered deep dotdeep decoy \
              ci/all agg.x aggxx orphan
          include standard.mk
          v1x2-check: decoy ## what v1.2-check matches as a pattern
          v1.2-check: dotdeep ## a dotted name
          covered: dir/stamp v1.2-check ## on a path and on a dotted name
          dir/stamp: deep
          deep: ## reached only through dir/stamp
          dotdeep: ## reached only through v1.2-check
          decoy: ## reached only through v1x2-check
          ci/all: deep dotdeep ## an aggregate named as a path
          agg.x: deep ## a dotted aggregate with no recipe
          orphan: ## run by nothing
          EOF
          # The one recipe: agg.x's pattern also matches aggxx's block.
          printf 'aggxx: orphan ## what agg.x matches, with a recipe\n\t@:\n' \
            >> "$tmp/Makefile"
          pass() {  # pass <label> <make args...>: exit 0, nothing on stderr
            label="$1"; shift
            if ! make -s -C "$tmp" "$@" > "$tmp/out" 2> "$tmp/err"; then
              cat "$tmp/out" "$tmp/err"; echo "::error::$label failed"; exit 1
            fi
            if [ -s "$tmp/err" ]; then
              cat "$tmp/err"; echo "::error::$label wrote to stderr"; exit 1
            fi
            echo "ok   pass: $label"
          }
          refuse() {  # refuse <label> <text> <make args...>: fails, naming it
            label="$1"; text="$2"; shift 2
            if make -s -C "$tmp" "$@" > "$tmp/out" 2>&1; then
              cat "$tmp/out"; echo "::error::$label passed"; exit 1
            fi
            if ! grep -qF -- "$text" "$tmp/out"; then
              cat "$tmp/out"; echo "::error::$label: no '$text'"; exit 1
            fi
            echo "ok   refused: $label"
          }

          # gates-check: CI's deep and dotdeep are reachable from gates only
          # through dir/stamp and v1.2-check; decoy only through v1x2-check.
          printf 'jobs:\n  x:\n    steps:\n' > "$ci"
          for t in lint covered deep dotdeep; do
            printf '      - run: make %s\n' "$t" >> "$ci"
          done
          pass "gates-check walks a path and a dotted name" \
            gates-check GATES_DEPS="lint covered"
          printf '      - run: make decoy\n' >> "$ci"
          refuse "gates-check, a CI target only a look-alike reaches" \
            "'make decoy'" gates-check GATES_DEPS="lint covered"

          # gates-home-check: deep and dotdeep are homed by walking down from
          # covered; ci/all and agg.x are recipe-less aggregates of homed
          # parts. aggxx's recipe is not agg.x's.
          printf 'jobs:\n  x:\n    steps:\n' > "$ci"
          printf '      - run: make %s\n' lint covered >> "$ci"
          pass "gates-home-check, down a path and up an aggregate" \
            gates-home-check
          refuse "gates-home-check, a gate only a look-alike reaches" \
            "'make decoy'" gates-home-check \
            GATES_DEPS="lint covered deep dotdeep ci/all agg.x decoy"

          # help and help-check: each name finds its own description.
          pass "help-check" help-check
          make -s -C "$tmp" help > "$tmp/help"
          for want in "v1[.]2-check  *a dotted name" \
                      "ci/all  *an aggregate named as a path"; do
            grep -qE "^  $want\$" "$tmp/help" \
              || { cat "$tmp/help"; echo "::error::help lost: $want"; exit 1; }
          done
          echo "ok   pass: help names each target's own description"

          # hook-dispatch-check: v1.2.check is no target, though as a pattern
          # it matches v1x2-check.
          hooks() {
            { printf 'repos:\n  - repo: local\n    hooks:\n'
              for t in "$@"; do
                printf '      - id: %s\n        name: %s\n' "$t" "$t"
                printf '        entry: make -s %s\n' "$t"
                printf '        language: system\n'
              done
            } > "$tmp/.pre-commit-config.yaml"
          }
          hooks v1.2-check agg.x
          pass "hook-dispatch-check, dotted targets that exist" \
            hook-dispatch-check
          hooks v1.2-check v1.2.check
          refuse "hook-dispatch-check, a dotted target that does not exist" \
            "  v1.2.check" hook-dispatch-check
          echo "OK — a target name is a string: paths and dots, no stderr."

      - name: One red gate does not hide the gates behind it
        # `gates` re-invokes its list with -k instead of declaring it as
        # prerequisites, because make stops at the first failing prerequisite
        # and the rest never run. That reads as an ordinary failure while a
        # third of the set was silently skipped -- measured in doppler, where
        # `glibc-check` cannot pass on a dev box by design, sits mid-list, and
        # made six targets behind it structurally unreachable.
        #
        # Four properties, because three of them are what makes the current
        # form SAFE and a fix that drops one is not a fix: everything runs, the
        # run still fails, ALL PASS cannot print, and a clean run still passes.
        #
        # The four recipe lines below carry LITERAL TABS, as every make recipe
        # must. They are legal here because they sit in a block scalar's
        # CONTENT rather than its indentation -- but a reformat that converts
        # them to spaces breaks this fixture, so leave them alone.
        run: |
          tmp="$(mktemp -d)"; cp standard.mk "$tmp/"
          cat > "$tmp/Makefile" <<'EOF'
          TEST_CMD = @echo test
          TEST_FAST_CMD = @echo test-fast
          CLEAN_PATHS = dist/
          GATES_DEPS = first red behind1 behind2
          LOCAL_TARGETS = first red behind1 behind2
          include standard.mk

          first: ## ordered before the red gate
          	@echo RAN-first
          red: ## fails, as some gates do by design
          	@echo RAN-red; exit 1
          behind1: ## ordered behind the red gate
          	@echo RAN-behind1
          behind2: ## also behind
          	@echo RAN-behind2
          EOF
          make -C "$tmp" gates > "$tmp/log" 2>&1 && rc=0 || rc=$?
          cat "$tmp/log"
          for t in first red behind1 behind2; do
            grep -q "RAN-$t" "$tmp/log" \
              || { echo "::error::$t never ran — one red gate still hides the rest"; exit 1; }
          done
          [ "$rc" -ne 0 ] \
            || { echo "::error::a failing gate did not fail the run"; exit 1; }
          grep -q "ALL PASS" "$tmp/log" \
            && { echo "::error::ALL PASS printed with a gate red"; exit 1; }
          # ...and gates-check must survive the list moving out of the
          # prerequisites. It walks the closure from `gates`, so a walk of
          # prerequisites alone now finds NOTHING and reports every CI target
          # as uncovered -- which would turn `make lint` red in every adopter.
          mkdir -p "$tmp/.github/workflows"
          printf 'jobs:\n  x:\n    steps:\n      - run: make install-deps\n      - run: make behind2\n' \
            > "$tmp/.github/workflows/ci.yml"
          make -C "$tmp" gates-check \
            || { echo "::error::gates-check cannot see GATES_DEPS any more"; exit 1; }
          # Clean tree: everything runs, run passes, ALL PASS prints.
          sed -i 's/@echo RAN-red; exit 1/@echo RAN-red/' "$tmp/Makefile"
          make -C "$tmp" gates > "$tmp/ok" 2>&1 \
            || { cat "$tmp/ok"; echo "::error::a clean gates run failed"; exit 1; }
          grep -q "ALL PASS" "$tmp/ok" \
            || { cat "$tmp/ok"; echo "::error::clean run did not print ALL PASS"; exit 1; }
          echo "OK — every gate runs, a red one still fails the run."

      - name: The gates do not re-enter the default goal
        # Both gates dump make's database with `$(MAKE) -rpn`, and -n still
        # EXECUTES recipe lines containing $(MAKE). With no goal named, that
        # sub-make builds .DEFAULT_GOAL -- so a repo configuring ALL_DEPS to
        # reach `lint` (what skills://makefile-convention prescribes for shell
        # repos) made the gates invoke themselves without bound: ~900
        # processes on a bare `make`, and no output saying why. See #13.
        #
        # Bounded by `timeout` rather than asserted structurally, because the
        # regression's symptom is "never returns" -- the only honest test is
        # to run it and require it to finish.
        run: |
          tmp="$(mktemp -d)"; cp standard.mk "$tmp/"
          cat > "$tmp/Makefile" <<'EOF'
          TEST_CMD = @echo test
          TEST_FAST_CMD = @echo test-fast
          CLEAN_PATHS = dist/
          ALL_DEPS = lint test
          include standard.mk
          EOF
          # Distinguish the two failure modes. A bare `||` would report every
          # non-zero exit as "did not terminate", pointing a future operator
          # at a hang when the gates had merely failed for a real reason.
          rc=0
          timeout 60 make -C "$tmp" help-check ghost-check || rc=$?
          if [ "$rc" -eq 124 ]; then
            echo "::error::gates did not terminate with lint in the default goal chain — the recursion is back"
            exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "::error::gates failed (exit $rc) — a real failure, not a hang; see the output above"
            exit 1
          fi
          echo "OK — gates terminate regardless of the default goal."

      - name: tag-release refuses a red commit, and fails open otherwise
        # just-makeit#1327 follow-on. `tag-release` checked everything about
        # the TAG and nothing about the tree it points at -- and a release tag
        # must not move, so a tag pushed onto a red commit spends a version
        # number.
        #
        # The shipped recipe text is EXTRACTED and RUN, not merely parsed.
        # `make -n` cannot see either mistake the first cut made: a recipe
        # line with no `\` continuation (which splits the `if` across two
        # shells) and a missing `--paginate` (a real release commit carries 47
        # check-runs against a page size of 30, so the aggregate was never
        # found and every commit read as "not concluded" -- including a red
        # one, which is the case the guard exists for).
        run: |
          set -euo pipefail
          awk '/# >>> ci-guard/,/# <<< ci-guard/' standard.mk \
            | grep -v '^#' \
            | sed 's/^\t@\?//; s/\$\$/$/g; s/$(CI_CHECK_NAME)/CI passed/g' \
            > guard.sh
          test -s guard.sh || { echo "::error::ci-guard markers found nothing"; exit 1; }
          sh -n guard.sh

          # A recipe line without a trailing `\` splits the `if` across two
          # shells, so `slug=` is set in one and read empty in the next. The
          # extracted form above CANNOT see this -- as shell it is simply two
          # statements and runs fine -- so assert it against the Makefile
          # text, which is the medium where it matters.
          bad=$(awk '/# >>> ci-guard/,/# <<< ci-guard/' standard.mk \
                | grep -vE '^#' | grep -vE '^[[:space:]]*fi$' | grep -vE '\\$' || true)
          if [ -n "$bad" ]; then
            echo "::error::guard recipe line(s) missing a continuation:"
            printf '%s\n' "$bad"
            exit 1
          fi

          bin="$(mktemp -d)"
          printf '%s\n' '#!/bin/sh' \
            'case "$*" in' \
            '  "auth status") exit 0 ;;' \
            '  *nameWithOwner*) echo acme/widget ;;' \
            '  *--paginate*check-runs*) printf "%s\\n" "$FAKE" ;;' \
            '  *check-runs*) : "past page 1 - unpaginated finds nothing" ;;' \
            'esac' > "$bin/gh"
          chmod +x "$bin/gh"

          # A concluded-bad commit is REFUSED, and says which conclusion.
          for c in failure timed_out cancelled action_required; do
            if out=$(FAKE="$c" PATH="$bin:$PATH" sh guard.sh 2>&1); then
              echo "::error::guard accepted a '$c' commit"; exit 1
            fi
            case "$out" in
              *"concluded '$c'"*) ;;
              *) echo "::error::wrong message for $c: $out"; exit 1 ;;
            esac
          done

          # Green is silent and proceeds.
          out=$(FAKE=success PATH="$bin:$PATH" sh guard.sh 2>&1) \
            || { echo "::error::guard rejected a green commit"; exit 1; }
          test -z "$out" || { echo "::error::green was not silent: $out"; exit 1; }

          # Not concluded -> advisory, never fatal.
          out=$(FAKE="" PATH="$bin:$PATH" sh guard.sh 2>&1) \
            || { echo "::error::guard is not fail-open on an unknown state"; exit 1; }
          case "$out" in *"has not concluded"*) ;; *)
            echo "::error::no advisory printed: $out"; exit 1 ;; esac

          # No gh at all -> silent, and still fails open.
          PATH=/usr/bin:/bin sh guard.sh \
            || { echo "::error::guard is not fail-open without gh"; exit 1; }

          echo "  ok  refuses red, silent on green, advisory + open otherwise"

      # ci-changes, which lets a bump-only commit skip an adopter's matrix,
      # is tested in tests/test_ci_changes.py: the changelog job below runs
      # every test there.

  # ------------------------------------------------------------------
  # Does what Pages serves equal what is committed here? The question the
  # drift gate asks from the other side, and only meaningful on main (a
  # PR's copy is not published yet), so the STEP is main-only while the
  # job always runs: a skipped job would read as a failure to CI passed.
  #
  # It waits on the Pages build for this commit, not on a clock. Asked at
  # once, the answer on a push that changes a served file is
  # definitionally no (the deploy has only just started); asked for a
  # fixed ten minutes inside the standard.mk job, a 13.6-minute deploy
  # outlasted it, and main went red on a file Pages served 2.5 minutes
  # later (#118). scripts/pages-wait.py holds the logic and the reasons,
  # and Re-vendor adopters runs the same script, so the two cannot answer
  # differently. A build a newer push cancelled is followed to that
  # push's build; a file a newer commit changed is that commit's run to
  # check. The plain URL is compared, as an adopter fetches it: the build
  # having succeeded is what says Pages published, so a cache-buster has
  # nothing left to prove.
  # ------------------------------------------------------------------
  serving:
    name: Pages serves this commit
    runs-on: ubuntu-latest
    # Above pages-wait.py's budget plus its grace, so the script, not the
    # runner, reports a slow Pages (tests/test_pages_wait.py holds this).
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read  # the Pages build's run, by commit
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Serving matches the repo
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/pages-wait.py

  # ------------------------------------------------------------------
  # scripts/ is CANONICAL too: every repo vendors these and compares against
  # them on every `make lint`, exactly like standard.mk. Until now nothing
  # here ran on them at all, so a syntax error or a bad diagnosis shipped to
  # every adopter and was caught, if at all, mid-release.
  # ------------------------------------------------------------------
  scripts:
    name: scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Every script parses
        run: |
          set -euo pipefail
          n=0
          for f in scripts/*.sh; do
            bash -n "$f"; echo "  ok  $f"; n=$((n+1))
          done
          # A loop over an empty glob passes silently, which would make this
          # job a description of a check rather than a check.
          [ "$n" -gt 0 ] || { echo "::error::no scripts found"; exit 1; }

      - name: shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning scripts/*.sh

      - name: pwsh_find reaches pwsh.exe when PATH does not (just-buildit.github.io#61)
        # A WSL shell reached over ssh has no Windows directories on PATH;
        # pwsh_find must fall back to win-exe (jbs/windows.sh) rather than
        # report no PowerShell on a machine that has one.
        run: |
          set -euo pipefail
          t="$(mktemp -d)"
          # A fake C: drive holding a stand-in pwsh.exe, and a mount table naming it.
          mkdir -p "$t/c/Program Files/PowerShell/7" "$t/bin"
          printf '#!/bin/sh\n' >"$t/c/Program Files/PowerShell/7/pwsh.exe"
          chmod +x "$t/c/Program Files/PowerShell/7/pwsh.exe"
          printf 'C:\\134 %s 9p rw,aname=drvfs;path=C:\\ 0 0\n' "$t/c" >"$t/mounts"
          # A PATH with no pwsh on it (ubuntu runners ship one), only what the lookup
          # itself runs, plus a wslpath stand-in to mark this as WSL.
          for c in awk dirname cat; do ln -s "$(command -v "$c")" "$t/bin/$c"; done
          printf '#!/bin/sh\necho "$2"\n' >"$t/bin/wslpath"; chmod +x "$t/bin/wslpath"
          got="$(env -i PATH="$t/bin" JB_PROC_MOUNTS="$t/mounts" "$BASH" -c \
            '. scripts/pwsh-lib.sh; pwsh_find || exit 9; echo "$PWSH|$PWSH_TRANSLATE"')" || got="(pwsh_find found nothing)"
          want="$t/c/Program Files/PowerShell/7/pwsh.exe|1"
          rm -rf "$t"
          [ "$got" = "$want" ] || { echo "::error::pwsh_find gave '$got', want '$want'"; exit 1; }
          echo "  ok  pwsh_find falls back to win-exe under the C: mount"

      - name: A failure it can attribute is never reported as a flake
        # just-makeit#1327. `release-watch` printed "likely a flake" for every
        # pre-publish failure, including the verify-ci one it had diagnosed
        # two lines above — deterministic, and the cause every single time the
        # message appeared. "Flake" is the one word that stops the next reader
        # looking, so it must not be reachable for a failure we can name.
        #
        # Scanned over the lines the script PRINTS, not the whole file: a
        # plain substring scan matches the comment explaining this very fix,
        # so the detector would be blinded by an example of what it looks for.
        run: |
          set -euo pipefail
          printed="$(grep -n '^[^#]*echo' scripts/release-watch.sh || true)"
          [ -n "$printed" ] || { echo "::error::no echo lines — not armed"; exit 1; }
          if echo "$printed" | grep -q 'likely a flake'; then
            echo "::error::release-watch prints a guess for a failure it can name:"
            echo "$printed" | grep 'likely a flake'
            exit 1
          fi
          # Replacing the guess with silence would be no better — the reader
          # needs to know WHICH job failed to judge whether a rerun is worth
          # anything.
          echo "$printed" | grep -q 'failed: \${FAILED_JOBS' \
            || { echo "::error::the failing job names are never printed"; exit 1; }
          echo "  ok  names the failure instead of guessing at it"

  # ------------------------------------------------------------------
  # Aggregator: the single "CI passed" check the `main` ruleset requires.
  # Adding a job above means adding it to `needs:` here — otherwise the
  # aggregator goes green while the new job is red, and the required check
  # stops meaning anything. Mirrors doppler and just-buildit/.github so the
  # org has one shape.
  # ------------------------------------------------------------------
  # scripts/changelog.py is vendored like everything else in scripts/, and
  # it RUNS in every adopter's `make lint` -- on the adopter's python3, which
  # may be as old as the oldest one they support. So its behaviour tests run
  # on that floor as well as today's interpreter: a 3.10-only spelling would
  # pass here on the newest and break an adopter's lint on the day it
  # re-vendors.
  changelog:
    name: changelog.py (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Doctests
        run: python -m doctest scripts/changelog.py
      - name: Behaviour, over real git repos
        run: python -m unittest discover -s tests -v

  # scripts/msvc-env.sh replaces ilammy/msvc-dev-cmd (node20, unmaintained)
  # at every adopter's Windows build. It can only be proven on Windows, so
  # it is proven here: the toolchain is ABSENT before it runs (the job can
  # fail), present in the NEXT step (it went through $GITHUB_ENV), and both
  # compilers an adopter uses -- cl.exe and clang-cl, which drives MSVC's
  # headers and linker -- build and run a program with it. A bad arch is
  # refused rather than half-applied.
  msvc-env:
    name: msvc-env.sh (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Without it, there is no MSVC environment
        run: |
          if command -v cl.exe || [ -n "${VSCMD_ARG_TGT_ARCH:-}" ]; then
            echo "::error::the runner already has an MSVC environment, so"
            echo "  the checks below could pass without msvc-env.sh"
            exit 1
          fi
      - name: A bad arch is refused
        run: |
          if scripts/msvc-env.sh no-such-arch; then
            echo "::error::msvc-env.sh accepted an arch vcvarsall rejects"
            exit 1
          fi
      - name: MSVC developer environment (x64)
        run: scripts/msvc-env.sh x64
      - name: A later step builds with cl.exe and clang-cl
        run: |
          [ "$VSCMD_ARG_TGT_ARCH" = x64 ]
          printf '#include <stdio.h>\nint main(void) { puts("ok"); return 0; }\n' >t.c
          cl.exe //nologo t.c //Fe:t_cl.exe
          [ "$(./t_cl.exe | tr -d '\r')" = ok ]
          clang-cl //nologo t.c //Fe:t_clang.exe
          [ "$(./t_clang.exe | tr -d '\r')" = ok ]

  ci-passed:
    name: CI passed
    needs:
      - standard-mk
      - serving
      - scripts
      - changelog
      - msvc-env
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `always()` so this still runs when a dependency failed — otherwise it
    # would be skipped, the required check would never report, and a red PR
    # would look identical to an unmergeable one.
    if: always()
    steps:
      - name: Require all jobs to have succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || \
                "${{ contains(needs.*.result, 'cancelled') }}" == "true" || \
                "${{ contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "::error::a required CI job did not succeed — CI not green"
            exit 1
          fi
          echo "All required CI jobs succeeded."
