name: Mirror upstream scripts

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC
  workflow_dispatch:       # manual refresh
  repository_dispatch:
    types: [mirror]        # remote trigger from source repos

# GITHUB_TOKEN only checks out; every write goes through the App token.
permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Fetch upstream scripts
        run: |
          set -euo pipefail
          declare -A SOURCES=(
            [get-jb.sh]="https://raw.githubusercontent.com/just-buildit/just-bashit/main/src/just_bashit/get-jb.sh"
            [just-runit]="https://raw.githubusercontent.com/just-buildit/just-bashit/main/src/just_bashit/just-runit"
            # Shadowed by the aliases.toml entry pointing at jbs/, so this
            # copy is only reached if that fetch fails -- and it sat at
            # 0.4.1 while jbs/ was three releases ahead. A fallback that
            # silently serves a year-old script is worse than none, so it
            # is mirrored rather than left to rot or deleted out from under
            # anyone who hardcoded the URL.
            [install-deps.sh]="https://raw.githubusercontent.com/just-buildit/just-bashit/main/src/just_bashit/install-deps.sh"
            # Add get-just-makeit.sh, get-just-bashit.sh, get-just-buildit.sh here as they land.
          )
          for dest in "${!SOURCES[@]}"; do
            url="${SOURCES[$dest]}"
            echo "fetching ${url} -> ${dest}"
            curl -sSL --fail --proto '=https' --tlsv1.2 -o "${dest}.new" "${url}"
            if [ -f "${dest}" ] && cmp -s "${dest}" "${dest}.new"; then
              echo "  unchanged"
              rm -f "${dest}.new"
            else
              mv "${dest}.new" "${dest}"
              echo "  updated"
            fi
          done

      - name: Mirror just-bashit co-fetch libs to /jbs/
        run: |
          set -euo pipefail
          # jbx co-fetches the whole sibling lib set (datetime, environment,
          # logging, ...) on every just-bashit:* call. Serve them from the
          # Pages CDN so _JBS_BASE no longer hits rate-limited
          # raw.githubusercontent from shared CI runner IPs.
          tmp="$(mktemp -d)"
          git clone --depth 1 \
            https://github.com/just-buildit/just-bashit "${tmp}/jb"
          mkdir -p jbs
          rm -f jbs/*.sh jbs/just-runit
          cp "${tmp}"/jb/src/just_bashit/*.sh jbs/
          cp "${tmp}"/jb/src/just_bashit/just-runit jbs/
          rm -rf "${tmp}"

      # main is ruleset-protected (CI passed + standard.mk, bypass: org
      # admins only), so a direct push is refused (GH013). It was, every run
      # from 2026-09-20 on, which left jbs/ serving just-bashit as of
      # 2026-09-09. The refresh goes through a PR like any other change.
      #
      # Pushed with the org App's token, not GITHUB_TOKEN: a push made with
      # GITHUB_TOKEN triggers no workflows, so the required checks would
      # never run and the PR could never merge. One fixed branch, so repeat
      # runs update the open PR instead of stacking new ones.
      - name: Mint an App token
        id: token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.ADOPTER_APP_ID }}
          private-key: ${{ secrets.ADOPTER_APP_PRIVATE_KEY }}

      - name: Open or update the refresh PR
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BRANCH: mirror/refresh
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name  "just-buildit-bot"
          git config user.email "bot@just-buildit.invalid"
          git switch -c "$BRANCH"
          git add -A
          git commit -m "mirror: refresh upstream scripts"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${BRANCH}"
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            gh pr create --head "$BRANCH" --base main \
              --title "mirror: refresh upstream scripts" \
              --body "Automated by mirror.yml: just-bashit's shipped scripts, copied to jbs/ and the root fetch fallbacks. Merges itself once the required checks pass."
          fi
          gh pr merge "$BRANCH" --auto --squash
