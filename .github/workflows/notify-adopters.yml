name: Re-vendor adopters

# Publishing here turns every adopter's `standard-check` red at once, and
# nothing used to tell them (#41). Measured: `just-buildit` and `doppler` sat
# red on `main` with nobody aware, `~/.claude` and `mcp-store` went red an
# hour later when a second change landed, and two open re-vendor PRs silently
# stopped being re-vendors between being cut and reviewed. Five repos, the
# same one-line fix, each found by hand.
#
# So this opens the PR rather than sending a reminder. A reminder is a chore
# someone has to act on; a PR is a review.

on:
  push:
    branches: [main]
    paths:
      - standard.mk
      - scripts/**
      - github/**
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List adopters and diffs, open no PRs"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: re-vendor-adopters
  cancel-in-progress: false

jobs:
  # "Canonical merged" and "canonical is SERVING it" are different events, and
  # only the second is safe to vendor from. Measured the hard way: a
  # `standard-update` run straight after a merge fetched the PRE-merge file,
  # reported every vendored file matching, and would have re-drifted minutes
  # later once Pages caught up. Fanning out before the deploy would send every
  # adopter to fetch a stale copy — worse than not fanning out at all.
  #
  # Its own job so the fan-out waits on it ONCE rather than per-org.
  serving:
    name: Wait for Pages to serve this commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Compare what is served against what is committed
        run: |
          set -euo pipefail
          for f in standard.mk $(git ls-files 'scripts/*' 'github/*'); do
            want=$(sha256sum "$f" | cut -d' ' -f1)
            echo "waiting for $f ($want)"
            for i in $(seq 1 60); do
              got=$(curl -fsSL "https://just-buildit.github.io/$f" 2>/dev/null \
                    | sha256sum | cut -d' ' -f1 || true)
              [ "$got" = "$want" ] && { echo "  served after $((i*10))s"; break; }
              if [ "$i" = 60 ]; then
                echo "::error::Pages never served the current $f — not fanning out"
                exit 1
              fi
              sleep 10
            done
          done

  fan-out:
    name: Re-vendor ${{ matrix.org }}
    needs: serving
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # One org's app installation being missing must not stop the others
      # being served. Each org reports its own outcome.
      fail-fast: false
      matrix:
        # The one written list here, and deliberately so: a GitHub App mints
        # its token PER OWNER, so the orgs have to be enumerated somewhere.
        # This is safe in a way the repo list was not — a missing org fails
        # its job loudly (no installation, no token) and an extra one fails
        # too (no adopters). The repo list was dangerous precisely because a
        # missing repo was SILENT.
        org: [just-buildit, hunterdsp, doppler-dsp]

    steps:
      # A fine-grained PAT has a single resource owner, so one cannot span
      # these three orgs — and three PATs would reintroduce a hand-maintained
      # org→secret mapping, which is the bug class the derivation below
      # exists to avoid. A GitHub App is minted per owner at runtime instead:
      # permissions are exactly Contents + Pull requests write, the tokens
      # are short-lived, and revoking is per-org.
      - name: Mint an installation token for ${{ matrix.org }}
        id: token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.ADOPTER_APP_CLIENT_ID }}
          private-key: ${{ secrets.ADOPTER_APP_PRIVATE_KEY }}
          owner: ${{ matrix.org }}

      # Derived from the tree, never from a written list.
      #
      # A hand-maintained repo list is the exact bug class this whole thread
      # started from: just-makeit's CI allow-list named `jb.toml` for months
      # after the rename, costing an hour of CI per release.
      #
      # NOT `gh search code`: measured, it returned 1 of the 4 just-buildit
      # adopters and 0 of the hunterdsp ones. A fan-out that silently skips
      # adopters reproduces the bug it exists to fix.
      - name: Derive this org's adopters
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ORG: ${{ matrix.org }}
          SELF: just-buildit/just-buildit.github.io
        run: |
          set -euo pipefail
          : > adopters.txt
          for r in $(gh repo list "$ORG" --limit 100 --json name --jq '.[].name'); do
            slug="$ORG/$r"
            [ "$slug" = "$SELF" ] && continue
            if gh api "repos/$slug/contents/standard.mk" --jq .name >/dev/null 2>&1; then
              echo "$slug" >> adopters.txt
            fi
          done
          n=$(wc -l < adopters.txt)
          echo "$ORG: $n adopter(s)"
          cat adopters.txt
          if [ "$n" -eq 0 ]; then
            echo "::error::$ORG yielded no adopters. Either the app is not"
            echo "::error::installed on the repos that vendor standard.mk, or"
            echo "::error::this org no longer has any. Refusing to report a"
            echo "::error::silent success — that is how an adopter gets missed."
            exit 1
          fi

      - name: Open a re-vendor PR where the vendored files have moved
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          # Who "this bot" is, for closing only its OWN superseded PRs.
          BOT_SLUG: ${{ steps.token.outputs.app-slug }}
          DRY_RUN: ${{ inputs.dry_run }}
          SHA: ${{ github.sha }}
          ORG: ${{ matrix.org }}
        run: |
          set -euo pipefail
          git config --global user.name "just-buildit[bot]"
          git config --global user.email "noreply@just-buildit.invalid"
          branch="chore/re-vendor-$(echo "$SHA" | cut -c1-7)"
          opened=0; clean=0; failed=0

          while read -r slug; do
            [ -n "$slug" ] || continue
            echo "::group::$slug"
            rm -rf work
            if ! gh repo clone "$slug" work -- --depth 1 >/dev/null 2>&1; then
              echo "::warning::cannot clone $slug"
              failed=$((failed+1)); echo "::endgroup::"; continue
            fi

            # The adopter's own `make standard-update`, not a central copy of
            # the files: its Makefile is the only thing that knows which files
            # IT vendors. Guessing that centrally is the written-list trap one
            # layer up.
            # TWICE: an adopter still on a standard.mk older than #76's fix
            # updates with the recipe it HAS, which fetches the new
            # standard.mk but not a file that copy newly vendors, and its
            # check fails. The second run re-parses the new copy and fetches
            # it; when nothing is new it is a no-op. Drop the first call once
            # every adopter carries the one-pass recipe.
            if ! ( cd work && { make standard-update >/dev/null 2>&1 || true; } \
                     && make standard-update >/dev/null 2>&1 ); then
              echo "::warning::standard-update failed in $slug"
              failed=$((failed+1)); echo "::endgroup::"; continue
            fi

            # Close this bot's OLDER re-vendor PRs in $slug: each canonical
            # merge opens one, and none was ever closed, so a repo that could
            # not merge them for a while held fifteen. $1 is the PR that
            # supersedes them, or empty when the repo is already current.
            # Best effort: a failed close is a warning, never the fan-out's
            # failure.
            close_stale() {
              # Cannot tell its own PRs from a human's -> closes nothing.
              if [ -z "${BOT_SLUG:-}" ]; then
                echo "::warning::no app slug; not closing stale PRs in $slug"
                return 0
              fi
              # AUTHOR first: a human's re-vendor-with-fixes PR carries the same
              # title and the same branch prefix (just-makeit#1800 did), and
              # closing it would delete its branch. Title and prefix stay as a
              # second guard.
              gh pr list --repo "$slug" --state open \
                --author "app/$BOT_SLUG" \
                --search "chore: re-vendor from canonical in:title" \
                --json number,headRefName,author \
                --jq ".[] | select(.author.login == \"app/$BOT_SLUG\")
                          | select(.headRefName | startswith(\"chore/re-vendor-\"))
                          | select(.headRefName != \"$branch\") | .number" |
              while read -r old; do
                why="Superseded by #$1: a newer canonical commit."
                [ -n "$1" ] || why="Superseded: $slug already matches canonical $SHA."
                gh pr close "$old" --repo "$slug" --delete-branch \
                  --comment "$why" >/dev/null \
                  && echo "closed stale #$old" \
                  || echo "::warning::could not close stale #$old in $slug"
              done
            }

            # --porcelain, not `git diff --quiet`: a NEWLY vendored file is
            # untracked, and diff never sees it, so a repo owing only that
            # file read as "already current".
            if [ -z "$(cd work && git status --porcelain)" ]; then
              echo "already current"; clean=$((clean+1))
              [ "$DRY_RUN" = "true" ] || close_stale ""
              echo "::endgroup::"; continue
            fi

            ( cd work && git status --short )
            if [ "$DRY_RUN" = "true" ]; then
              echo "(dry run — no PR)"; echo "::endgroup::"; continue
            fi

            # `gh repo clone` leaves an unauthenticated https remote, so
            # the push prompts for a username and dies with
            # "could not read Username for 'https://github.com'". The token
            # goes on the remote explicitly rather than via a credential
            # helper -- one fewer moving part, and Actions masks it in logs.
            git -C work remote set-url origin \
              "https://x-access-token:${GH_TOKEN}@github.com/$slug.git"

            if ( cd work
                 git checkout -b "$branch"
                 msg=$(printf '%s\n' \
                   "chore: re-vendor from canonical $SHA" \
                   "" \
                   "Opened automatically: publishing to just-buildit.github.io" \
                   "turns every adopter's standard-check red at once, and" \
                   "nothing used to say why (just-buildit.github.io#41)." \
                   "" \
                   "make standard-update, not an edit -- vendored files are" \
                   "verbatim and the drift gate fails make lint on any" \
                   "difference." \
                   "" \
                   "Canonical commit: $SHA")
                 # add -A, then commit: `commit -a` stages TRACKED files only,
                 # so every newly vendored script was fetched and then left
                 # out (fa8477f's PRs carried standard.mk alone, and each
                 # adopter's standard-check named the missing file).
                 git add -A
                 git commit -qm "$msg"
                 git push -q -u origin "$branch"
                 base=$(gh repo view "$slug" \
                        --json defaultBranchRef -q .defaultBranchRef.name)
                 gh pr create --repo "$slug" --head "$branch" --base "$base" \
                   --title "chore: re-vendor from canonical $(echo "$SHA" | cut -c1-7)" \
                   --body "$msg" > ../pr-url ); then
              echo "PR opened: $(cat pr-url)"; opened=$((opened+1))
              close_stale "$(basename "$(cat pr-url)")"
            else
              echo "::warning::could not open a PR in $slug"
              failed=$((failed+1))
            fi
            echo "::endgroup::"
          done < adopters.txt

          {
            echo "### $ORG"
            echo ""
            echo "| result | count |"
            echo "| --- | --- |"
            echo "| PR opened | $opened |"
            echo "| already current | $clean |"
            echo "| failed | $failed |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # A fan-out that quietly skipped half its adopters is the failure
          # this exists to prevent, so a failure here fails the job.
          [ "$failed" -eq 0 ]
