# just-buildit org default-namespace alias manifest.
#
# `jx NAME` consults this table FIRST, and only probes
# https://just-buildit.github.io/${NAME}.{sh,py} when a name is not listed
# here — see the resolution order in just-runit, which checks aliases.toml
# before falling through to the direct probe. This comment said the reverse
# until 2026-09-08, which matters: it makes a root-level script look like
# the thing being served when an alias is in fact shadowing it.
#
# Third-party tools welcomed via PR — keep entries pinned to a tag/sha
# rather than a moving branch.

[aliases]
install-deps   = "https://just-buildit.github.io/jbs/install-deps.sh"
make-run       = "https://just-buildit.github.io/jbs/make-run.sh"
get-jb         = "https://just-buildit.github.io/get-jb.sh"
get-doppler    = "https://raw.githubusercontent.com/doppler-dsp/doppler/4fb2f3ad55ddb07198d545d4b6d6b4552791f4c2/scripts/get-doppler.sh"
